    <!-- 'unsafe-eval' is required for the WebView2 fallback: when the runtime

         top-level `class gc` cannot be declared at global scope, so bridge.js
         re-runs the unchanged bundle source inside a function scope instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
    </style>
    <link rel="stylesheet" href="assets/index-DgmMz9-g.css">
    <script src="bridge.js?v=20260820-webview-gc-loader-2"></script>
    <!-- bridge.js exclusively chooses one boot path after inspecting WebView2:
         a classic same-origin script in ordinary browsers, or the verified
         function-scoped source fallback when --expose-gc is present. Keeping a
         second parser-owned script tag here would race that decision and make
         the real desktop WebView execute both paths. -->
  </head>
