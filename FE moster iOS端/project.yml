name: FEMonsterIOS

options:
  bundleIdPrefix: com.femonster
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.45.4"
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.8.8"
    CURRENT_PROJECT_VERSION: "188"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  FEMonsterIOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - Info.plist
      - path: App/GeneratedResources/Web
        type: folder
      - path: App/GeneratedResources/NodeGateway
        type: folder
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.femonster.ios
        PRODUCT_NAME: FE Monster
        INFOPLIST_FILE: App/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Support/FEMonsterIOS-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

schemes:
  FEMonsterIOS:
    build:
      targets:
        FEMonsterIOS: all
    run:
      config: Debug
    archive:
      config: Release
