<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>粒子歌词 · 实时预览</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/particle-lyrics.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:'Microsoft YaHei',sans-serif;background:#050b12;color:#d9e7ed}#host{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#0d1828 0%,#050b12 65%)}header{position:absolute;top:42px;left:48px;pointer-events:none;z-index:2}header small{font-size:10px;letter-spacing:4px;color:#6e8a9d}h1{font-size:18px;font-weight:500;letter-spacing:6px;margin:12px 0}footer{position:absolute;bottom:38px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#768e9e;z-index:2}button,select{font:inherit;background:#15212d;border:1px solid #354854;color:#b4d9e6;padding:9px 12px;border-radius:5px}#controls{position:absolute;right:16px;top:16px;bottom:80px;width:290px;overflow:auto;background:#101922ed;padding:18px;z-index:4;display:none}body.controls #controls{display:block}button{cursor:pointer}.caption{letter-spacing:2px}@media(max-width:600px){header{left:24px;top:28px}footer{left:24px;right:24px;bottom:20px}.caption{display:none}}
</style></head><body><div id="host"></div><header><small>FE MONSTER / PARTICLE LYRICS</small><h1>粒子歌词</h1></header><div id="controls"></div><footer><span class="caption">星尘凝字 · 随声流动</span><div><select id="mode" aria-label="歌词呈现方式"><option value="line">整排聚合</option><option value="progressive">逐字聚合</option><option value="sung">唱到字聚合</option></select> <button id="play">播放演示</button> <button id="settings">参数</button></div></footer>
<script src="/vendor/three.r128.min.js"></script><script src="/particle-lyrics-shape-editor.js"></script><script src="/particle-lyrics-settings.js"></script><script src="/particle-lyrics-runtime.js"></script><script>
const api=FeParticleLyricsRuntime,settingsApi=FeParticleLyricsSettings;
window.runtime=api.create(document.getElementById('host'),{pixelRatio:1,onTransformChange:()=>settingsApi.syncControls(document.getElementById('controls'),runtime.settings)});
window.frame={now:1000,playing:false,hasLyric:true,text:'让星光落在你的眼里',lyricKey:'demo',lineStart:0,lineEnd:12,displayTime:0,bass:0.3,beat:0.1};
window.step=(count=1,changes={})=>{Object.assign(frame,changes);for(let i=0;i<count;i++){frame.now+=1000/60;api.update(runtime,frame);}return api.diagnostics(runtime)};
window.configure=patch=>api.setSettings(runtime,{...runtime.settings,...patch});
window.animate=false;const livePreview=new URLSearchParams(location.search).has('live');let last=0;
function tick(now){if(animate||livePreview){const dt=Math.min(.05,(now-last)/1000||0);frame.now=now;if(animate){frame.displayTime=(frame.displayTime+dt)%12;frame.bass=.25+Math.max(0,Math.sin(now*.006))*0.5;frame.beat=Math.max(0,Math.sin(now*.006))**10;}api.update(runtime,frame);}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);step(1);
document.getElementById('mode').onchange=e=>{configure({presentation:e.target.value});settingsApi.syncControls(document.getElementById('controls'),runtime.settings);step(1);};
document.getElementById('play').onclick=e=>{animate=!animate;frame.playing=animate;e.target.textContent=animate?'暂停演示':'播放演示';};
document.getElementById('settings').onclick=()=>document.body.classList.toggle('controls');
settingsApi.renderControls(document.getElementById('controls'),runtime.settings,(key,value)=>{api.setSettings(runtime,key==='reset'?settingsApi.normalize():settingsApi.change(runtime.settings,key,value));settingsApi.syncControls(document.getElementById('controls'),runtime.settings);step(1);});
</script></body></html>
